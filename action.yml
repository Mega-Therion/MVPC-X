name: 'MVPC-X Claim Auditor'
description: 'Sovereign claim-verification and proof auditing GitHub Action'
author: 'Sovereign Physics Lab'
inputs:
  path:
    description: 'Path to file or directory to audit'
    required: false
    default: '.'
  policy:
    description: 'Policy level: permissive, default, strict'
    required: false
    default: 'default'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install MVPC-X
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Run MVPC-X Audit
      shell: bash
      run: |
        mvpc audit "${{ inputs.path }}" --policy "${{ inputs.policy }}"
