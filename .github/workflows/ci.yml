name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" || pip install -e .
          pip install pytest sympy
      - name: Test
        run: pytest -q --tb=short
      - name: Import smoke
        run: |
          python -c "from mvpc.version import __version__; print(__version__)"
          python -c "from mvpc.hardened_pipeline import HardenedSovereignPipeline"
          python -c "from mvpc.kernel_backends import run_kernel"
