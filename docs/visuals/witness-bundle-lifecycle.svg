<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">MVPC-X artifact verification lifecycle</title><desc id="desc">Editable diagram of a local artifact becoming a canonical hash, evaluated gates, a trust verdict, and a tamper-evident witness bundle.</desc><rect width="1600" height="900" fill="#07111f"/><g font-family="ui-sans-serif,system-ui,sans-serif"><text x="100" y="100" fill="#e7f0fa" font-size="38" font-weight="700">MVPC-X • ARTIFACT VERIFICATION</text><text x="100" y="140" fill="#91a9c2" font-size="20">Integrity and provenance verification do not strengthen the truth status of the upstream claim.</text></g><g fill="none" stroke="#f2c14e" stroke-width="5"><path d="M350 410H445"/><path d="M700 410H795"/><path d="M1050 410H1145"/></g><g fill="#f2c14e"><polygon points="445,410 415,392 415,428"/><polygon points="795,410 765,392 765,428"/><polygon points="1145,410 1115,392 1115,428"/></g><g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle"><rect x="90" y="270" width="260" height="280" rx="24" fill="#0b2130" stroke="#42c9d7" stroke-width="3"/><text x="220" y="360" fill="#eef7ff" font-size="25" font-weight="700">LOCAL ARTIFACT</text><text x="220" y="405" fill="#a9c6d5" font-size="18">schema id</text><text x="220" y="435" fill="#a9c6d5" font-size="18">version</text><text x="220" y="465" fill="#a9c6d5" font-size="18">commit provenance</text><rect x="445" y="270" width="255" height="280" rx="24" fill="#12213e" stroke="#8996ff" stroke-width="3"/><text x="572" y="360" fill="#eef7ff" font-size="25" font-weight="700">CANONICALIZE</text><text x="572" y="405" fill="#bbc5ff" font-size="18">stable payload</text><text x="572" y="435" fill="#bbc5ff" font-size="18">content hash</text><text x="572" y="465" fill="#bbc5ff" font-size="18">tamper detection</text><rect x="795" y="270" width="255" height="280" rx="24" fill="#211c3e" stroke="#b77bff" stroke-width="3"/><text x="922" y="360" fill="#eef7ff" font-size="25" font-weight="700">EVALUATE GATES</text><text x="922" y="405" fill="#d8baff" font-size="18">passed</text><text x="922" y="435" fill="#d8baff" font-size="18">failed / unavailable</text><text x="922" y="465" fill="#d8baff" font-size="18">not applicable</text><rect x="1145" y="270" width="365" height="280" rx="24" fill="#173226" stroke="#60d394" stroke-width="3"/><text x="1327" y="360" fill="#eef7ff" font-size="25" font-weight="700">WITNESS BUNDLE</text><text x="1327" y="405" fill="#a8e9c2" font-size="18">verdict + gate record</text><text x="1327" y="435" fill="#a8e9c2" font-size="18">sealed provenance</text><text x="1327" y="465" fill="#a8e9c2" font-size="18">replayable evidence</text></g><rect x="190" y="680" width="1220" height="82" rx="18" fill="#102030" stroke="#29435e" stroke-width="2"/><text x="800" y="732" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" fill="#d4e3f2" font-size="22">A verdict of <tspan fill="#60d394" font-weight="700">passed</tspan> means configured artifact gates passed—not that MVPC-X independently proved the underlying theorem or physics.</text></svg>